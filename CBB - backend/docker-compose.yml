version: '3.8'

services:
  web:
    build: .
    container_name: cbb_backend_dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # <-- Esto mapea tu carpeta local dentro del contenedor en tiempo real
    environment:
      - MODULE_NAME=app.main
    # Si usas un archivo .env para tus variables de entorno, descomenta la siguiente línea:
    # env_file:
    #   - .env